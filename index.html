<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>أطلس الجماعات الإسلامية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: atlas sheet — map dominant, reading panel docked at the reading-start side, timeline rail under the map */
:root{
  --bg:#f3f5f2; --panel:#ffffff; --ink:#1d2624; --muted:#5d6b67; --line:#d5dcd8;
  --sea:#d7e5e6; --land:#e4e1d7; --border:#c3beb0; --accent:#1f7a5c; --accent-ink:#ffffff;
  --pos:#2f8f5b; --neg:#b4472c; --neu:#8a8f8c; --chip:#eef2ef; --shadow:0 1px 2px rgba(20,30,28,.06),0 6px 24px rgba(20,30,28,.07);
  --display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --c-leader:#1f7a5c; --c-scholar:#2d5d9f; --c-preacher:#c7811c; --c-thinker:#7a5aa6; --c-fighter:#a8432f; --c-ruler:#6f7a1f; --c-adversary:#8c2f39; --c-other:#8a8f8c;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1416; --panel:#151d20; --ink:#e4ebe8; --muted:#97a6a1; --line:#2a3538;
  --sea:#101b1f; --land:#253031; --border:#3b4846; --accent:#4fbf95; --accent-ink:#0b1412;
  --pos:#5cc98c; --neg:#e07a5a; --neu:#8d9794; --chip:#1d272a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);
  --c-leader:#4fbf95; --c-scholar:#6c9be0; --c-preacher:#e3a643; --c-thinker:#a78bd4; --c-fighter:#e07a5a; --c-ruler:#b9c24a; --c-adversary:#e06a78; --c-other:#9aa19e;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1416; --panel:#151d20; --ink:#e4ebe8; --muted:#97a6a1; --line:#2a3538;
  --sea:#101b1f; --land:#253031; --border:#3b4846; --accent:#4fbf95; --accent-ink:#0b1412;
  --pos:#5cc98c; --neg:#e07a5a; --neu:#8d9794; --chip:#1d272a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);
  --c-leader:#4fbf95; --c-scholar:#6c9be0; --c-preacher:#e3a643; --c-thinker:#a78bd4; --c-fighter:#e07a5a; --c-ruler:#b9c24a; --c-adversary:#e06a78; --c-other:#9aa19e;
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr;height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:clamp(22px,3vw,30px);margin:0;line-height:1.2;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0;max-width:80ch}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel);flex:none}
.lang button{border:0;background:none;padding:6px 14px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.main{display:grid;grid-template-columns:minmax(330px,410px) 1fr;gap:12px;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;background:none;border:0;padding:10px 8px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pbody{overflow:auto;padding:16px;min-height:0;flex:1}
.mapcol{display:grid;grid-template-rows:1fr auto;gap:12px;min-height:0;min-width:0}
.mapbox{position:relative;background:var(--sea);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:320px;direction:ltr}
#map{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.country{fill:var(--land);stroke:var(--border);stroke-width:.5;vector-effect:non-scaling-stroke;transition:fill .5s}
.yearbig{position:absolute;top:10px;left:14px;font-family:var(--display);font-size:clamp(34px,5vw,56px);line-height:1;color:var(--ink);opacity:.85;pointer-events:none;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.eventcap{position:absolute;top:68px;left:14px;width:max-content;max-width:min(320px,60%);font-size:13px;color:var(--muted);pointer-events:none}
.mapctl{position:absolute;bottom:10px;left:10px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:18px;line-height:1}
.legend{position:absolute;bottom:10px;right:10px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;max-width:calc(100% - 70px)}
.legend .lg{display:grid;grid-template-columns:repeat(2,auto);gap:2px 12px}
.legend span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.layer-toggle{position:absolute;top:10px;right:10px;display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:12px}
.layer-toggle button{border:0;background:none;padding:6px 10px;cursor:pointer;color:var(--muted)}
.layer-toggle button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pdot{stroke:var(--panel);stroke-width:1.5;cursor:pointer}
.pdot.sel{stroke:var(--ink);stroke-width:2.5}
.pdot.dim{opacity:.25}
.pava{cursor:pointer}
.pava-ring{fill:none;stroke-width:2.5;pointer-events:none}
.plabel{font-size:11px;fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-width:3px;stroke-linejoin:round;pointer-events:none;font-weight:600}
.gmark{cursor:pointer;stroke:var(--panel);stroke-width:1.5}
.rel{fill:none;stroke-width:2;stroke-linecap:round;opacity:.85}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;box-shadow:var(--shadow);max-width:260px;z-index:5;display:flex;gap:8px;align-items:center}
.tip b{display:block;font-size:13.5px}
/* avatars */
.ava{flex:none;border-radius:50%;object-fit:cover;object-position:50% 20%;background:var(--chip);display:inline-grid;place-items:center;font-family:var(--display);color:#fff;font-weight:700;overflow:hidden;border:2px solid var(--cat,var(--line))}
.ava-xs{width:30px;height:30px;font-size:13px}
.ava-sm{width:36px;height:36px;font-size:15px}
.ava-lg{width:88px;height:88px;font-size:34px;border-width:3px}
span.ava{background:var(--cat)}
/* timeline */
.timeline{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px 8px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;box-shadow:var(--shadow);direction:ltr}
.play{width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;display:grid;place-items:center}
.track{position:relative;padding-top:18px}
.ticks{position:absolute;top:0;left:0;right:0;height:16px}
.tick{position:absolute;top:4px;width:2px;height:10px;background:var(--muted);opacity:.55;transform:translateX(-1px);border:0;padding:0;cursor:pointer}
.tick:hover,.tick.on{opacity:1;background-color:var(--accent);height:14px;top:2px}
input[type=range]{width:100%;accent-color:var(--accent);margin:0;height:22px}
.scale{position:relative;height:16px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.scale span{position:absolute;transform:translateX(-50%);white-space:nowrap}
/* panel content */
.hint{color:var(--muted);font-size:14px;margin:0}
.search{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin:10px 0 4px}
.plist{display:flex;flex-direction:column;gap:2px}
.prow{display:flex;align-items:center;gap:10px;width:100%;text-align:start;background:none;border:0;padding:5px 8px;border-radius:8px;cursor:pointer}
.prow:hover{background:var(--chip)}
.prow .nm{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.prow .nm small{color:var(--muted);font-size:12px}
.prow > small{color:var(--muted);margin-inline-start:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.02em;font-weight:600;margin:20px 0 6px;display:flex;align-items:center;gap:8px}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
.phead{display:flex;gap:14px;align-items:center;margin-top:10px}
h2{font-family:var(--display);font-size:24px;margin:0;line-height:1.3}
.meta{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.lead{margin:12px 0 0;font-size:15.5px}
.more{background:none;border:0;color:var(--accent);cursor:pointer;padding:2px 0;font-weight:600;font-size:13.5px}
.long{margin:6px 0 0;color:var(--ink);font-size:14.5px}
/* opinion gauge: physical left = negative, right = positive, in both languages */
.gauge{position:relative;height:32px;margin:6px 14px 0;direction:ltr}
.gauge .bar{position:absolute;left:-14px;right:-14px;top:14px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--neg),var(--neu) 50%,var(--pos))}
.gauge .mid{position:absolute;left:50%;top:10px;width:2px;height:12px;background:var(--muted);opacity:.5;transform:translateX(-1px)}
.gauge .face{position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:24px;line-height:32px;transition:left .9s cubic-bezier(.2,.9,.25,1.2)}
.gauge-cap{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);direction:ltr}
.gauge-cap .n{color:var(--neg)} .gauge-cap .p{color:var(--pos)}
.verdict{font-size:12.5px;font-weight:600}
.creed{display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:6px 10px;font-weight:600;font-size:13.5px;border:1px solid var(--line)}
.creed i{width:10px;height:10px;border-radius:50%;display:inline-block}
.stances{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:8px}
.stance{display:flex;align-items:center;gap:8px;font-size:13px;background:var(--chip);border-radius:8px;padding:6px 8px}
.stance svg{width:20px;height:20px;flex:none;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stance.neg svg{stroke:var(--neg)}
.item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
.item-h{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:0;text-align:start;cursor:pointer}
.item-h b{font-weight:600}
.item-h small{color:var(--muted);margin-inline-start:auto;font-variant-numeric:tabular-nums}
.item p{margin:4px 0 0;font-size:14px}
.sub2{color:var(--muted);font-size:13.5px}
.relname{background:none;border:0;padding:0;cursor:pointer;font-weight:600;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px;text-align:start}
.relname:hover{text-decoration-color:var(--accent)}
.off{color:var(--muted);font-size:12px}
.journey{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.jrow{display:grid;grid-template-columns:52px 1fr;gap:8px;background:none;border:0;text-align:start;padding:4px 6px;border-radius:6px;cursor:pointer;font-size:13.5px}
.jrow:hover{background:var(--chip)}
.jrow.cur{background:var(--chip);font-weight:600}
.jrow span:first-child{color:var(--muted);font-variant-numeric:tabular-nums}
.status{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.st{display:flex;align-items:center;gap:8px;font-size:13.5px;border-radius:8px;padding:6px 10px;background:var(--chip);border:0;width:100%;text-align:start}
button.st{cursor:pointer}
.st i{width:10px;height:10px;border-radius:3px;flex:none}
.grow{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;width:100%;background:none;border:0;text-align:start;padding:8px;border-radius:8px;cursor:pointer}
.grow:hover{background:var(--chip)}
.grow.inactive{opacity:.45}
.grow small{color:var(--muted);font-variant-numeric:tabular-nums}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.back{background:none;border:0;color:var(--muted);cursor:pointer;padding:0;font-size:13px}
.parts{display:flex;flex-wrap:wrap;gap:6px}
.parts a{font-size:12.5px;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.note{font-size:12px;color:var(--muted);border-top:1px solid var(--line);margin-top:18px;padding-top:10px}
.loading{display:grid;place-items:center;height:100%;color:var(--muted)}
/* flag badge on the portrait */
.ava-wrap{position:relative;flex:none;display:inline-block;line-height:0}
.flag{position:absolute;bottom:0;inset-inline-end:-6px;width:30px;height:22.5px;border-radius:4px;border:2px solid var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.25);object-fit:cover;background:var(--chip)}
.ctry{display:inline-flex;align-items:center;gap:5px}
.ctry img{width:18px;height:13.5px;border-radius:2px;box-shadow:0 0 0 1px var(--line)}
/* book shelf */
.shelf{display:flex;flex-wrap:wrap;gap:12px 10px;margin-top:10px}
.bk{position:relative;width:50px;height:70px;border:0;padding:0;cursor:pointer;border-radius:3px 6px 6px 3px;background:var(--cv);color:#fff;
  box-shadow:inset 6px 0 0 rgba(0,0,0,.22),inset 7px 0 0 rgba(255,255,255,.12),0 1px 2px rgba(0,0,0,.18),0 4px 10px rgba(0,0,0,.12);display:grid;place-items:center;transition:transform .15s,box-shadow .15s}
.bk:hover,.bk:focus-visible{transform:translateY(-3px) rotate(-1.5deg);box-shadow:inset 6px 0 0 rgba(0,0,0,.22),inset 7px 0 0 rgba(255,255,255,.12),0 2px 4px rgba(0,0,0,.2),0 10px 18px rgba(0,0,0,.18)}
.bk svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin-inline-start:4px;opacity:.95}
.bk::after{content:"";position:absolute;left:12px;right:6px;bottom:9px;height:2px;background:rgba(255,255,255,.55);border-radius:1px}
.bk .yr{position:absolute;top:5px;left:10px;right:4px;font-size:9.5px;line-height:1;font-weight:600;text-align:center;opacity:.85;font-variant-numeric:tabular-nums;direction:ltr}
.bk.nodate .yr{opacity:.55}
.btip{position:fixed;z-index:20;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;box-shadow:var(--shadow);max-width:240px;line-height:1.45}
.btip b{display:block;font-size:13.5px}
.btip small{color:var(--muted)}
.shelf-h{display:flex;align-items:center;gap:10px;margin-top:16px}
.shelf-h .ava{cursor:pointer}
/* book card */
dialog.bcard{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:0;width:min(460px,calc(100vw - 32px));max-height:calc(100vh - 48px);box-shadow:var(--shadow)}
dialog.bcard::backdrop{background:rgba(10,16,15,.45)}
.bc-in{padding:20px;overflow:auto;max-height:calc(100vh - 50px)}
.bc-top{display:flex;gap:16px;align-items:flex-start}
.bc-top .bk{width:74px;height:104px;cursor:default;flex:none}
.bc-top .bk:hover{transform:none}
.bc-top .bk svg{width:32px;height:32px}
.bc-top .bk .yr{font-size:12px;top:8px}
.bc-close{position:absolute;top:10px;inset-inline-end:10px;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:18px;line-height:1}
.bc-kind{display:inline-block;font-size:12px;font-weight:600;color:var(--muted);background:var(--chip);border-radius:6px;padding:1px 8px}
.bc-auth{display:flex;align-items:center;gap:8px;margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;background:none;cursor:pointer;text-align:start}
.bc-auth:hover{background:var(--chip)}
.credits{display:flex;flex-direction:column;gap:6px;margin-top:8px;font-size:12.5px}
.credits a{color:var(--accent)}
.credit{font-size:11.5px;color:var(--muted);margin-top:6px}
.credit a{color:inherit}
/* group logos: real emblem on a white disc, or a monogram in the group's colour */
.glogo{flex:none;display:inline-grid;place-items:center;border-radius:50%;background:#fff;border:2px solid var(--gc);overflow:hidden;width:30px;height:30px;vertical-align:middle}
.glogo img{width:76%;height:76%;object-fit:contain}
.glogo.mono{background:var(--gc);color:#fff;font-weight:700;font-family:var(--body);font-size:11px;line-height:1;letter-spacing:-.02em}
.glogo-sm{width:20px;height:20px;font-size:8.5px!important;border-width:1.5px}
.glogo-lg{width:68px;height:68px;font-size:22px!important;border-width:3px}
.ghead{display:flex;gap:14px;align-items:center;margin-top:10px}
.gbadge{cursor:pointer}
.gmono{fill:#fff;font-size:8.5px;font-weight:700;pointer-events:none;font-family:var(--body)}
.gmore{font-size:10px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-width:3px;pointer-events:none}
/* figure search scope */
.scope{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:6px}
.scope button{flex:1;border:0;background:none;padding:5px 6px;cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:600;white-space:nowrap}
.scope button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.range{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--muted)}
.range input{width:84px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;font-variant-numeric:tabular-nums}
.alsohint{background:none;border:1px dashed var(--line);border-radius:8px;padding:6px 10px;margin-top:8px;width:100%;text-align:start;cursor:pointer;color:var(--accent);font-weight:600;font-size:13px}
/* legend as a collapsible panel */
.legend summary{cursor:pointer;font-weight:600;color:var(--muted);list-style:none;grid-column:1/-1}
.legend summary::-webkit-details-marker{display:none}
.legend summary::before{content:"▸ ";display:inline-block}
.legend[open] summary::before{content:"▾ "}
.legend[open] summary{margin-bottom:4px}
/* portrait overlays in the card: bars while in prison, a black mourning sash once dead (photos may already be black and white, so no greyscale) */
.ava-ov{position:absolute;left:0;top:0;width:88px;height:88px;border-radius:50%;overflow:hidden;pointer-events:none}
.ava-ov.jail{background:repeating-linear-gradient(90deg,transparent 0 10px,rgba(24,26,28,.82) 10px 14px)}
.ava-ov .sash{position:absolute;width:150%;height:16px;left:-52%;top:18%;transform:rotate(-45deg);background:#111;box-shadow:0 0 0 1.5px rgba(255,255,255,.9)}
.st.jail svg,.jrow .lock{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.jrow.jailrow{grid-template-columns:96px 1fr}
.jrow.jailrow span:last-child{display:flex;align-items:center;gap:6px}
/* prison marker on the map */
.prison{cursor:pointer}
.prison rect{fill:#3b4146;stroke:var(--panel);stroke-width:1.5}
.prison line{stroke:#fff;stroke-width:1.6;stroke-linecap:round}
.prison.empty{opacity:.35}
.prison text{font-size:9px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-width:3px}
/* episode player: the sheikh's videos through YouTube's own embedded player */
/* header actions: the labelled "listen" button sits beside the language switch, where it is seen first */
.hdr-act{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.listen{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:8px 16px;background:var(--accent);color:var(--accent-ink);cursor:pointer;font-weight:700;font-size:14px;box-shadow:var(--shadow)}
.listen:hover{filter:brightness(1.08)}
.listen[aria-pressed="true"]{background:var(--panel);color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.listen svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* timeline event marks: 2 px to see, 12 px to hit */
.tick{width:12px;padding:0 5px;background-clip:content-box;transform:translateX(-6px)}
/* card sections that fold */
details.sec{margin-top:4px}
details.sec>summary{cursor:pointer;list-style:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"▸";display:inline-block;transition:transform .15s}
[dir="rtl"] details.sec>summary::before{content:"◂"}
details.sec[open]>summary::before{transform:rotate(90deg)}
[dir="rtl"] details.sec[open]>summary::before{transform:rotate(-90deg)}
.rface{font-size:15px;vertical-align:-1px}
.howl{margin:4px 0 0;padding-inline-start:20px;color:var(--muted);font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.howl li::marker{color:var(--accent)}
.mapcol:has(.player:not([hidden])){grid-template-rows:1fr auto auto}
.player{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px 10px;display:flex;gap:12px;align-items:center;direction:ltr;min-width:0}
.yt{flex:none;width:200px;height:113px;border-radius:8px;overflow:hidden;background:#000}
.yt iframe{display:block;width:100%;height:100%;border:0}
.pl-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.pl-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.pl-row select{flex:1;min-width:0;max-width:100%;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
.pl-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:grid;place-items:center;padding:0;font-size:11px;font-weight:700;flex:none}
.pl-btn svg{width:16px;height:16px;fill:currentColor}
.pl-pp{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pl-time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pl-seek{flex:1;min-width:80px}
.follow{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 6px}
.follow:has(input:checked){color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.follow input{margin:0;accent-color:var(--accent)}
.pl-cap{font-size:13.5px;color:var(--ink);line-height:1.5;min-height:1.5em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:start}
.pl-cap small{color:var(--muted)}
.parts button{font:inherit;font-size:12.5px;color:var(--accent);background:none;border:1px solid var(--line);border-radius:6px;padding:2px 8px;cursor:pointer;text-align:start}
.parts button:hover{background:var(--chip)}
.parts .yt-link{border:0;padding:2px 2px;font-size:12px;color:var(--muted)}
.part{display:inline-flex;align-items:center;gap:2px}
/* phones: a floating switch between the map and the open card, and the two-finger hint */
.jump{position:fixed;z-index:30;bottom:max(16px,env(safe-area-inset-bottom,0px));inset-inline-end:16px;display:none;align-items:center;gap:6px;max-width:calc(100vw - 32px);
  border:0;border-radius:999px;padding:10px 16px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.3);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jump svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.maptoast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(10,16,15,.82);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;pointer-events:none;opacity:0;transition:opacity .25s;z-index:6;text-align:center;max-width:80%}
.maptoast.on{opacity:1}
@media (max-width:860px){
  .app{height:auto}
  .main{grid-template-columns:1fr}
  .mapcol{order:-1}
  .mapbox{height:56vh}
  .pbody{overflow:visible}
  .legend{font-size:11px}
  .eventcap{top:56px}
  .app{padding-bottom:max(76px,env(safe-area-inset-bottom,0px))}   /* room under the floating map/card button */
  #map{touch-action:pan-y pinch-zoom}   /* one finger scrolls the page; two fingers move the map */
  .jump:not([hidden]){display:inline-flex}
  .player{flex-wrap:wrap}
  .pl-row select{flex-basis:100%}
  .yt{width:100%;height:auto;aspect-ratio:16/9;max-width:360px;margin-inline:auto}
}
@media (max-width:520px){ .scale .s-narrow-hide{display:none} .tab{font-size:14px;padding:10px 2px} }
.tab{white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- shareable links: #p=qutb&y=1952, #g=ikhwan, #tab=books, #b=qutb.1 ---------- */
let lastHash = "", hashTimer = null;
function readHash(){
  const h = new URLSearchParams(location.hash.slice(1)), o = {};
  if (h.get("p")) o.p = h.get("p"); if (h.get("g")) o.g = h.get("g"); if (h.get("b")) o.b = h.get("b");
  if (["people","groups","books","about"].includes(h.get("tab"))) o.tab = h.get("tab");
  const y = parseInt(h.get("y"), 10); if (y >= Y0 && y <= NOW) o.y = y;
  return o;
}
function writeHash(){
  clearTimeout(hashTimer);
  hashTimer = setTimeout(() => {
    const h = new URLSearchParams();
    if (selP && tab === "people") h.set("p", selP); else if (selG && tab === "groups") h.set("g", selG); else if (tab !== "people") h.set("tab", tab);

}

/* ---------- map ---------- */
let svg, gRoot, gCountries, gLayerTop, gSpread, gFound, gPrison, proj, path, zoom, W = 800, H = 500, countries, ANCHOR = new Map();

  let t0 = null;

  svg.node().addEventListener("touchmove", e => { if (!t0 || !isPhone() || e.touches.length !== 1) return; const dx = Math.abs(e.touches[0].clientX - t0[0]), dy = Math.abs(e.touches[0].clientY - t0[1]); if (dx > 24 && dx > dy * 1.5){ toast(T().twoFingers); t0 = null; } }, {passive: true});
  svg.call(zoom).on("dblclick.zoom", null);

  $("#lay-all").onclick = () => { layerAll = true; $("#lay-all").setAttribute("aria-pressed", "true"); $("#lay-sel").setAttribute("aria-pressed", "false"); paintCountries(); };

}
function resize(){

const pt = (lon, lat) => transform.apply(proj([lon, lat]));
// the group whose spread is shown in "selected" mode: the chosen group, or the selected figure's group that year
const focusGroup = () => { const g = selG ? GI[selG] : (selP && alive(PI[selP], year) ? GI[(memsAt(PI[selP], year).find(m => m[3] !== "x") || [])[2]] : null); return g && gActive(g, year) ? g : null; };
// groups present in each country this year, biggest spread first
function groupsByCountry(){
  const m = new Map();
  G.filter(g => gActive(g, year)).sort((a, b) => regAt(b, year).length - regAt(a, year).length || a.y - b.y)
    .forEach(g => regAt(g, year).forEach(c => { if (!m.has(c)) m.set(c, []); m.get(c).push(g); }));

function stripePattern(gs){
  const id = "st-" + gs.map(g => g.id).join("-");

    const w = 5, p = d3.select("#defs").append("pattern").attr("id", id).attr("patternUnits", "userSpaceOnUse")
      .attr("width", w * gs.length).attr("height", w * gs.length).attr("patternTransform", "rotate(45)");

    groupsByCountry().forEach((gs, c) => fill.set(c, gs.length === 1 ? d3.interpolateRgb(css("--land"), gs[0].c)(0.7) : stripePattern(gs.slice(0, 5))));

// one logo badge (r = 10 before scaling): real emblem on white, or a monogram on the group's colour

    const e = enter.append("g").attr("class", cls + " gbadge");

// logos on the countries a group spread to
function drawSpread(){

    groupsByCountry().forEach((gs, c) => { const a = ANCHOR.get(c); if (!a) return; const [x, y] = pt(a[0], a[1]), show = gs.slice(0, 3);
      show.forEach((g, i) => items.push({key: g.id + "@" + c, g, x: x + (i - (show.length - 1) / 2) * 15, y, s: .7}));

// a prison mark at a city only in the years a figure is held there (empty marks everywhere crowded the map)
let PRISONS = null;
function drawPrisons(){

  const items = [];
  PRISONS.forEach((from, c) => { if (year < from) return; const C = D.cities[c], [x, y] = pt(C[1], C[2]);
    const inside = P.filter(p => alive(p, year) && prisonAt(p, year)?.[2] === c);
    if (inside.length) items.push({c, x: x + 15, y: y + 13, inside}); });
  const sel = gPrison.selectAll("g.prison").data(items, d => d.c).join(enter => { const g = enter.append("g").attr("class", "prison");
    g.append("rect").attr("x", -7).attr("y", -7).attr("width", 14).attr("height", 14).attr("rx", 2.5);
    [-3.5, 0, 3.5].forEach(dx => g.append("line").attr("x1", dx).attr("x2", dx).attr("y1", -4.5).attr("y2", 4.5));
    g.append("text").attr("x", 9).attr("y", 4); return g; });
  sel.attr("transform", d => `translate(${d.x},${d.y})`).classed("empty", d => !d.inside.length)
    .select("text").text(d => d.inside.length > 1 ? d.inside.length : "");
  sel.on("click", (e, d) => { e.stopPropagation(); if (d.inside.length){ selectPerson(d.inside[0].id); revealPanel(); } })
    .on("mouseenter", (e, d) => showTip(e, `<div><b>🔒 ${T().prison} · ${esc(cityName(d.c))}</b>${d.inside.length ? esc(T().prisonNow(year, d.inside.map(nm).join(lang === "ar" ? "، " : ", "))) : esc(T().prisonEmpty(year))}</div>`))
    .on("mouseleave", hideTip);

function layout(){
  const byCity = d3.group(P.filter(p => alive(p, year)), p => cityAt(p, year)), out = [];
  const spread = transform.k >= 3 ? 22 : selP ? 14 : 7;
  byCity.forEach((arr, c) => {
    const C = D.cities[c]; if (!C) return;
    const base = pt(C[1], C[2]); arr.sort((a, b) => a.b - b.b);
    arr.forEach((p, k) => { const r = k === 0 ? 0 : spread * Math.sqrt(k) + 2, a = k * 2.4; out.push({p, x: base[0] + r * Math.cos(a), y: base[1] + r * Math.sin(a), city: c}); });
  });

}
function drawDots(animate){

function initTimeline(){
  const s = $("#slider");
  s.addEventListener("input", () => setYear(toYear(s.value / 1000)));
  $("#ticks").addEventListener("click", e => { const b = e.target.closest(".tick"); if (b) setYear(D.events[b.dataset.i][0]); });
  $("#scale").innerHTML = [1263, 1798, 1900, 1928, 1952, 1967, 1979, 1991, 2001, 2011, 2026].map(y => `<span${[1900, 1928, 1952, 1991, 2026].includes(y) ? "" : ' class="s-narrow-hide"'} style="left:${toPos(y) * 100}%">${y}</span>`).join("");
  $("#play").onclick = togglePlay;
  document.addEventListener("keydown", e => { if (e.target.matches("input")) return; if (e.key === "ArrowRight") setYear(year + 1); if (e.key === "ArrowLeft") setYear(year - 1); });
}
function togglePlay(){
  if (playing){ clearInterval(playing); playing = null; $("#playicon").setAttribute("d", "M4 2l10 6-10 6z"); return; }
  if (year >= NOW) setYear(1798);
  $("#playicon").setAttribute("d", "M3 2h4v12H3zM9 2h4v12H9z");
  playing = setInterval(() => { if (year >= NOW){ togglePlay(); return; } setYear(year + (year < 1900 ? 4 : 1)); }, 260);
}
function setYear(y, silent){
  year = Math.max(Y0 + 3, Math.min(NOW, y));
  $("#slider").value = Math.round(toPos(year) * 1000);
  $("#yearbig").textContent = year;
  let ei = -1; D.events.forEach((e, i) => { if (e[0] <= year) ei = i; });
  $("#eventcap").innerHTML = ei >= 0 && year - D.events[ei][0] <= 12 ? `<bdi dir="ltr">${D.events[ei][0]}</bdi> · ${esc(evText(ei))}` : "";
  document.querySelectorAll(".tick").forEach(t => t.classList.toggle("on", D.events[t.dataset.i][0] === year));
  paintCountries(); drawDots(!silent);
  if (!silent) render();
  writeHash();
}

let sameView = false;

function render(){

  const key = [tab, selP, selG, lang, tab === "people" && !selP ? [q, scope, rFrom, rTo].join("~") : ""].join("|");
  sameView = key === lastKey; lastKey = key;

  const secs = sameView ? [...b.querySelectorAll("details.sec")].map(d => d.open) : null;

function wire(b){
  const qi = b.querySelector("#q");
  if (qi) qi.addEventListener("input", () => { q = qi.value; const pos = qi.selectionStart; render(); const n = $("#q"); n.focus(); n.setSelectionRange(pos, pos); });
  // period inputs apply when the viewer leaves the box or presses Enter, so typing a year doesn't re-render mid-number
  b.querySelectorAll("#rfrom, #rto").forEach(inp => inp.addEventListener("change", () => {
    let a = parseInt($("#rfrom").value, 10), z = parseInt($("#rto").value, 10);
    a = isNaN(a) ? rFrom : Math.max(Y0, Math.min(NOW, a)); z = isNaN(z) ? rTo : Math.max(Y0, Math.min(NOW, z));
    if (a > z) [a, z] = [z, a];
    rFrom = a; rTo = z; saveScope(); render();
  }));
  b.onclick = e => {
    const t = e.target;
    const bk = t.closest("[data-bk]"); if (bk){ openBook(bk.dataset.bk); return; }
    const sc = t.closest("[data-scope]"); if (sc){ scope = sc.dataset.scope; if (scope === "range" && rFrom === 1950 && rTo === 1980) { rFrom = Math.max(Y0, year - 20); rTo = Math.min(NOW, year + 20); } saveScope(); render(); return; }
    const pp = t.closest("[data-p]"); if (pp){ selectPerson(pp.dataset.p, true); revealPanel(); return; }
    const gg = t.closest("[data-g]"); if (gg){ selectGroup(gg.dataset.g); revealPanel(); return; }
    if (t.closest("[data-back]")){ if (tab === "groups") selG = null; else selP = null; paintCountries(); drawDots(false); render(); writeHash(); revealPanel(); return; }
    const ep = t.closest("[data-ep]"); if (ep){ playFrom(+ep.dataset.ep, ep.dataset.from); revealMap(); return; }
    const jy = t.closest("[data-y]"); if (jy){ setYear(+jy.dataset.y); revealMap(); return; }
    const m = t.closest("[data-t]"); if (m){ const l = m.nextElementSibling; if (!m.dataset.lbl) m.dataset.lbl = m.textContent; l.hidden = !l.hidden; m.textContent = l.hidden ? m.dataset.lbl : T().hide; return; }
    const m2 = t.closest("[data-t2]"); if (m2){ const l = m2.parentElement.querySelector(".long"); l.hidden = !l.hidden; }
  };
}
function selectPerson(id, jump){
  const p = PI[id]; selP = id; selG = null; tab = "people";
  if (jump && !alive(p, year)) setYear(year < p.b ? Math.min(p.b + 20, p.d ?? NOW) : (p.d ?? NOW), true);
  paintCountries(); drawDots(true); render();
  $("#pbody").scrollTop = 0; writeHash();
}
function selectGroup(id){
  selG = id; tab = "groups";
  if (!gActive(GI[id], year)) setYear(GI[id].y, true);
  paintCountries(); drawDots(false); render(); $("#pbody").scrollTop = 0; writeHash();
}

/* ---------- episode player and "follow the sheikh" ----------
   Audio is the sheikh's own YouTube videos through the official embedded player (nothing is re-hosted).
   audio/<n>.json: {v: videoId, lines: [[sec, text]], cues: [[sec, "p"|"g", id] | [sec, "y", year]]},
   built from the word-timed captions by the private build script. */
const ERA_EP = [1950, 1850, 1930, 1952, 1958, 1975, 1990, 2010, 2016, 2020];   // each episode's centre of gravity
const EPD = {}, epData = n => EPD[n] || (EPD[n] = fetch(`audio/${n}.json`).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).catch(e => { delete EPD[n]; throw e; }));
let YTP = null, ytLoad = null, AU = {ep: 1, t: 0, follow: true, data: null, cue: -1, lastT: -1, timer: null, saved: 0, seeking: false};
try { const s = JSON.parse(localStorage.getItem("atlas-audio") || "null"); if (s && s.ep >= 1 && s.ep <= 10) { AU.ep = s.ep; AU.t = +s.t || 0; AU.follow = s.follow !== false; } } catch(e) {}
const saveAU = () => { try { localStorage.setItem("atlas-audio", JSON.stringify({ep: AU.ep, t: Math.floor(AU.t), follow: AU.follow})); } catch(e) {} };
const fmt = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = String(s % 60).padStart(2, "0"); return h ? `${h}:${String(m).padStart(2, "0")}:${x}` : `${m}:${x}`; };
function partLink(n, pid){
  const t = T();
  return `<span class="part"><button data-ep="${n}"${pid ? ` data-from="${pid}" title="${esc(t.playFrom)}"` : ""}>▶ ${n}. ${t.parts[n - 1]}</button><a class="yt-link" href="https://www.youtube.com/watch?v=${PARTS[n - 1]}" target="_blank" rel="noopener" title="${esc(t.onYT)}" aria-label="${esc(t.onYT)}">↗</a></span>`;
}
function loadYT(){
  if (ytLoad) return ytLoad;
  ytLoad = new Promise((res, rej) => { if (window.YT && YT.Player) return res();
    const prev = window.onYouTubeIframeAPIReady; window.onYouTubeIframeAPIReady = () => { if (prev) prev(); res(); };
    const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; s.onerror = () => { ytLoad = null; rej(new Error("yt")); }; document.head.appendChild(s); });
  return ytLoad;
}
function showPlayer(on){
  $("#player").hidden = !on; $("#listen").setAttribute("aria-pressed", on);
  clearInterval(AU.timer); AU.timer = on ? setInterval(tick, 300) : null;
  if (!on && YTP && YTP.pauseVideo) YTP.pauseVideo();
}
// open episode n at second t; autoplay only after a click (browsers block sound otherwise)
async function playEpisode(n, t = 0, auto = true){
  n = Math.max(1, Math.min(10, n)); showPlayer(true);
  if (playing) togglePlay();   // the timeline's own ▶ would fight the sheikh for the year
  AU.ep = n; AU.t = t; AU.data = null; AU.cue = -1; AU.lastT = -1; $("#pl-ep").value = n; $("#pl-cap").textContent = "…"; saveAU();
  let d; try { [d] = await Promise.all([epData(n), loadYT()]); } catch(e) { $("#pl-cap").textContent = T().loadErr; return; }
  if (AU.ep !== n) return;   // another episode was picked meanwhile
  AU.data = d;
  if (!YTP){
    const pv = {start: Math.floor(t), autoplay: auto ? 1 : 0, playsinline: 1, rel: 0};
    if (/^https?:/.test(location.protocol)) pv.origin = location.origin;
    YTP = new YT.Player("yt", {width: 200, height: 113, videoId: d.v, playerVars: pv,
      events: {onReady: () => { if (auto) YTP.playVideo(); }, onStateChange: e => {
        $("#pl-ppi").setAttribute("d", e.data === 1 ? "M3 2h4v12H3zM9 2h4v12H9z" : "M4 2l10 6-10 6z");
        if (e.data === 0 && AU.ep < 10) playEpisode(AU.ep + 1, 0, true);   // ended: carry on with the next episode
      }}});
  } else if (auto) YTP.loadVideoById({videoId: d.v, startSeconds: t}); else YTP.cueVideoById({videoId: d.v, startSeconds: t});
}
// "Mentioned in episodes": start a little before the first time the sheikh names this figure
function playFrom(n, pid){
  epData(n).then(d => { const c = pid ? d.cues.find(c => c[1] === "p" && c[2] === pid) : null; playEpisode(n, c ? Math.max(0, c[0] - 4) : 0, true); })
    .catch(() => playEpisode(n, 0, true));
}
const lastIdx = (arr, t) => { let lo = 0, hi = arr.length - 1, r = -1; while (lo <= hi){ const m = (lo + hi) >> 1; if (arr[m][0] <= t){ r = m; lo = m + 1; } else hi = m - 1; } return r; };
function tick(){
  if (!YTP || !YTP.getCurrentTime || !AU.data) return;
  const t = YTP.getCurrentTime() || 0, dur = YTP.getDuration() || 0; AU.t = t;
  if (!AU.seeking){ const s = $("#pl-seek"); s.max = Math.max(1, Math.floor(dur)); s.value = Math.floor(t); }
  $("#pl-time").textContent = `${fmt(t)} / ${fmt(dur)}`;
  const li = lastIdx(AU.data.lines, t), cap = li >= 0 ? AU.data.lines[li][1] : "";
  if ($("#pl-cap").textContent !== cap) $("#pl-cap").textContent = cap;
  if (Date.now() - AU.saved > 5000){ AU.saved = Date.now(); saveAU(); }
  if (AU.follow){
    const i = lastIdx(AU.data.cues, t);
    if (i !== AU.cue){
      if (AU.lastT < 0 || t < AU.lastT - 1 || t > AU.lastT + 5) replay(i);   // a seek: rebuild the state at this moment
      else for (let k = AU.cue + 1; k <= i; k++) applyCue(AU.data.cues[k]);
      AU.cue = i;
    }
  }
  AU.lastT = t;
}
// where to put the timeline for a figure he names without a year: inside the figure's life, near the episode's period
const repYear = p => { const hi = p.d ?? NOW, lo = Math.min(p.b + 25, hi); return Math.max(lo, Math.min(hi, ERA_EP[AU.ep - 1])); };
function applyCue(c){
  if (!c) return;
  if (c[1] === "y"){ if (c[2] !== year) setYear(c[2]); return; }
  if (c[1] === "p"){
    const p = PI[c[2]]; if (!p || (selP === p.id && tab === "people")) return;
    if (!alive(p, year)) setYear(repYear(p), true);
    selectPerson(p.id); bringIntoView(p); return;
  }
  const g = GI[c[2]]; if (!g || (selG === g.id && tab === "groups")) return;
  // a figure's own group being named keeps the figure open: the card already shows it
  if (selP && tab === "people" && memsAt(PI[selP], year).some(m => m[2] === g.id)) return;
  if (!gActive(g, year)) setYear(g.y, true);
  selectGroup(g.id);
}
function replay(i){
  if (i < 0) return;
  const cs = AU.data.cues.slice(0, i + 1), ent = cs.filter(c => c[1] !== "y").pop(), yc = cs.filter(c => c[1] === "y").pop();
  if (yc && (!ent || yc[0] >= ent[0] - 60)) setYear(yc[2], !!ent);
  if (ent){ selP = selG = null; applyCue(ent); }
}
// pan (never zoom) so a followed figure who is off screen comes to the middle
function bringIntoView(p){
  const C = D.cities[cityAt(p, year)]; if (!C) return;
  const [x, y] = pt(C[1], C[2]); if (x > 40 && x < W - 40 && y > 80 && y < H - 40) return;
  svg.transition().duration(700).call(zoom.translateBy, (W / 2 - x) / transform.k, (H / 2 - y) / transform.k);
}
$("#listen").onclick = () => {
  if (!$("#player").hidden){ showPlayer(false); return; }
  if (YTP && AU.data) showPlayer(true); else playEpisode(AU.ep, AU.t, true);
  if (isPhone()) setTimeout(() => $("#player").scrollIntoView({block: "nearest", behavior: smooth()}), 60);   // the player opens under the map
};
$("#pl-close").onclick = () => showPlayer(false);
$("#pl-ep").onchange = e => playEpisode(+e.target.value, 0, true);
$("#pl-prev").onclick = () => { if (AU.ep > 1) playEpisode(AU.ep - 1, 0, true); };
$("#pl-next").onclick = () => { if (AU.ep < 10) playEpisode(AU.ep + 1, 0, true); };
$("#pl-pp").onclick = () => { if (!YTP || !YTP.getPlayerState) return; YTP.getPlayerState() === 1 ? YTP.pauseVideo() : YTP.playVideo(); };
const skip = d => { if (YTP && YTP.seekTo) YTP.seekTo(Math.max(0, (YTP.getCurrentTime() || 0) + d), true); };
$("#pl-back").onclick = () => skip(-10); $("#pl-fwd").onclick = () => skip(10);
$("#pl-seek").addEventListener("input", () => { AU.seeking = true; $("#pl-time").textContent = `${fmt(+$("#pl-seek").value)} / ${fmt(YTP && YTP.getDuration ? YTP.getDuration() : 0)}`; });
$("#pl-seek").addEventListener("change", () => { AU.seeking = false; if (YTP && YTP.seekTo) YTP.seekTo(+$("#pl-seek").value, true); });
$("#pl-follow").checked = AU.follow;
$("#pl-follow").onchange = e => { AU.follow = e.target.checked; saveAU(); if (AU.follow && AU.data){ AU.cue = lastIdx(AU.data.cues, AU.t); replay(AU.cue); } };
function playerLang(){
  const t = T();
  $("#listen-t").textContent = t.listen; $("#play").title = t.playTL; $("#play").setAttribute("aria-label", t.playTL);
  $("#pl-follow-t").textContent = t.follow; $("#pl-follow").parentElement.title = t.followTip;
  [["#pl-prev", t.prevEp], ["#pl-next", t.nextEp], ["#pl-back", t.back10], ["#pl-fwd", t.fwd10], ["#pl-pp", t.playPause], ["#pl-close", t.closePl]].forEach(([s, l]) => { $(s).title = l; $(s).setAttribute("aria-label", l); });
  $("#pl-seek").setAttribute("aria-label", t.seek); $("#pl-cap").title = t.capNote;
  $("#pl-ep").innerHTML = PARTS.map((_, i) => `<option value="${i + 1}">${t.epN(i + 1)} · ${esc(t.parts[i])}</option>`).join(""); $("#pl-ep").value = AU.ep;
}
})();
</script>
